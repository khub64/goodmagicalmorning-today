name: Morning alert
on:
  schedule:
    # 7:30 New York in daylight time (UTC-4) and in standard time (UTC-5); the script waits until 9:00.
    # Starting early leaves room for GitHub's scheduled-run delays (often 40+ minutes).
    - cron: "30 11 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pywebpush>=2,<3"
      - run: python .github/send_push.py
        env:
          PUSH_ENDPOINT: ${{ secrets.PUSH_ENDPOINT }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SCHEDULE: ${{ github.event.schedule }}
